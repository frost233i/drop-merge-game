<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#e8d5c4">
  <meta name="description" content="Drop & Merge - A fun number puzzle game">
  <link rel="manifest" href="manifest.json">
  <title>动物沐场</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- Upper zone: info/decoration area (~35%) -->
    <div class="top-zone">
      <div class="header">
        <div class="scores">
          <div class="score-box">
            <div class="score-label">分数</div>
            <div class="score-value" id="score">0</div>
          </div>
          <div class="score-box">
            <div class="score-label">最高</div>
            <div class="score-value" id="best-score">0</div>
          </div>
        </div>
        <div class="title-group">
          <span class="game-title">动物沐场</span>
          <button class="btn-icon" id="btn-new" title="New Game">🔄</button>
        </div>
      </div>
    </div>

    <!-- Lower zone: game area (~65%) -->
    <div class="game-zone">
      <!-- Next preview: overlaps boundary between zones -->
      <div class="next-preview-row">
        <span class="next-label">下一个</span>
        <div class="next-block" id="next-block">1</div>
        <div class="next-block next-block-small" id="next-next-block">1</div>
      </div>

      <!-- Tile-bordered game area -->
      <div class="tile-border">
        <!-- Arrow buttons row -->
        <div class="arrow-row" id="arrow-row">
          <button class="arrow-btn" data-col="0"></button>
          <button class="arrow-btn" data-col="1"></button>
          <button class="arrow-btn" data-col="2"></button>
          <button class="arrow-btn" data-col="3"></button>
          <button class="arrow-btn" data-col="4"></button>
        </div>

        <!-- Game board: 6 rows (1 buffer + 5 main) x 5 cols -->
        <div class="board-wrapper">
          <div class="board" id="board">
            <!-- Cells generated by JS -->
          </div>
        </div>
      </div>

      <!-- Hand card button -->
      <div class="hand-card-row">
        <button class="hand-card-btn" id="btn-hand-card">
          <span class="hand-card-icon">🃏</span>
          <span class="hand-card-text">手牌</span>
        </button>
        <button class="hand-card-btn" id="btn-brush">
          <span class="hand-card-icon">🪥</span>
          <span class="hand-card-text">洗澡刷</span>
        </button>
      </div>
    </div>

    <!-- Hand card selection overlay -->
    <div class="hand-card-overlay" id="hand-card-overlay">
      <div class="hand-card-panel">
        <div class="hand-card-title">请选择下一个出现的动物方块</div>
        <div class="hand-card-grid" id="hand-card-grid">
          <!-- Populated by JS -->
        </div>
        <button class="hand-card-confirm" id="hand-card-confirm">确定</button>
      </div>
    </div>

    <!-- Overflow Warning overlay -->
    <div class="overlay overlay-warning" id="overflow-warning">
      <h2>这一步会超出判定线！</h2>
      <div class="warning-buttons">
        <button class="btn-warning-primary" id="btn-undo">撤销这一步</button>
        <button class="btn-warning-secondary" id="btn-warning-restart">重新开始</button>
      </div>
    </div>

    <!-- Game Over overlay -->
    <div class="overlay" id="overlay">
      <h2>游戏结束</h2>
      <div class="final-score" id="final-score">Score: 0</div>
      <button class="btn-restart" id="btn-restart">再来一局</button>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
